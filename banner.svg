<svg viewBox="0 0 1680 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="source" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="process" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="llm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="output" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="8" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1680" height="400" fill="#ffffff"/>

  <!-- Query -->
  <g>
    <circle cx="90" cy="215" r="54" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
    <text x="90" y="207" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#0f172a" text-anchor="middle">your</text>
    <text x="90" y="228" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#0f172a" text-anchor="middle">query</text>
  </g>
  <line x1="146" y1="215" x2="188" y2="215" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Stage 1: Sources -->
  <g>
    <rect x="190" y="145" width="205" height="140" rx="16" fill="url(#source)"/>
    <text x="292" y="192" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#082f49" text-anchor="middle">Search Sources</text>
    <text x="292" y="223" font-family="Arial, sans-serif" font-size="16" fill="#082f49" text-anchor="middle">arXiv</text>
    <text x="292" y="247" font-family="Arial, sans-serif" font-size="16" fill="#082f49" text-anchor="middle">Semantic Scholar</text>
    <text x="292" y="271" font-family="Arial, sans-serif" font-size="16" fill="#082f49" text-anchor="middle">HF Papers</text>
  </g>
  <line x1="397" y1="215" x2="433" y2="215" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Stage 2: Dedupe and Rank -->
  <g>
    <rect x="435" y="145" width="205" height="140" rx="16" fill="url(#source)"/>
    <text x="537" y="200" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#082f49" text-anchor="middle">Dedupe</text>
    <text x="537" y="230" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#082f49" text-anchor="middle">and Rank</text>
    <text x="537" y="260" font-family="Arial, sans-serif" font-size="16" fill="#082f49" text-anchor="middle">top N papers</text>
  </g>
  <line x1="642" y1="215" x2="678" y2="215" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Stage 3: Ingest -->
  <g>
    <rect x="680" y="145" width="205" height="140" rx="16" fill="url(#process)"/>
    <text x="782" y="197" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#1e1b4b" text-anchor="middle">Ingest PDFs</text>
    <text x="782" y="228" font-family="Arial, sans-serif" font-size="16" fill="#1e1b4b" text-anchor="middle">extract Limitations</text>
    <text x="782" y="252" font-family="Arial, sans-serif" font-size="16" fill="#1e1b4b" text-anchor="middle">and Future Work</text>
  </g>
  <line x1="887" y1="215" x2="923" y2="215" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Stage 4: Summarize -->
  <g>
    <rect x="925" y="145" width="205" height="140" rx="16" fill="url(#llm)"/>
    <text x="1027" y="197" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#431407" text-anchor="middle">Summarize</text>
    <text x="1027" y="228" font-family="Arial, sans-serif" font-size="16" fill="#431407" text-anchor="middle">small local model</text>
    <text x="1027" y="252" font-family="Arial, sans-serif" font-size="16" fill="#431407" text-anchor="middle">per paper</text>
  </g>
  <line x1="1132" y1="215" x2="1168" y2="215" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Stage 5: Synthesize -->
  <g>
    <rect x="1170" y="145" width="205" height="140" rx="16" fill="url(#llm)"/>
    <text x="1272" y="197" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#431407" text-anchor="middle">Synthesize</text>
    <text x="1272" y="228" font-family="Arial, sans-serif" font-size="16" fill="#431407" text-anchor="middle">large local model</text>
    <text x="1272" y="252" font-family="Arial, sans-serif" font-size="16" fill="#431407" text-anchor="middle">grounded ideas</text>
  </g>
  <line x1="1377" y1="215" x2="1413" y2="215" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Stage 6: Report -->
  <g>
    <rect x="1415" y="145" width="205" height="140" rx="16" fill="url(#output)"/>
    <text x="1517" y="197" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#052e16" text-anchor="middle">Markdown</text>
    <text x="1517" y="222" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#052e16" text-anchor="middle">Report</text>
    <text x="1517" y="252" font-family="Arial, sans-serif" font-size="15" fill="#052e16" text-anchor="middle">summaries, synthesis,</text>
    <text x="1517" y="271" font-family="Arial, sans-serif" font-size="15" fill="#052e16" text-anchor="middle">future work ideas</text>
  </g>

  <!-- caption: single centered line -->
  <text x="840" y="355" font-family="Arial, sans-serif" font-size="20" fill="#334155" text-anchor="middle">
    one query, no intermediate prompts, one grounded report
  </text>
</svg>
