<svg viewBox="0 0 1600 460" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="source" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="process" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="llm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="output" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
  </defs>

  <!-- solid white background: keeps text legible on GitHub in both light and dark theme -->
  <rect width="1600" height="460" fill="#ffffff"/>

  <text x="50" y="65" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="#0f172a">paper-scout</text>
  <text x="50" y="95" font-family="Arial, sans-serif" font-size="18" fill="#475569">query in, grounded research report out</text>

  <!-- Query -->
  <g>
    <circle cx="90" cy="255" r="48" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
    <text x="90" y="248" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">your</text>
    <text x="90" y="267" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">query</text>
  </g>
  <line x1="140" y1="255" x2="182" y2="255" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Stage 1: Sources -->
  <g>
    <rect x="185" y="195" width="190" height="120" rx="14" fill="url(#source)"/>
    <text x="280" y="235" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#082f49" text-anchor="middle">Search Sources</text>
    <text x="280" y="262" font-family="Arial, sans-serif" font-size="14" fill="#082f49" text-anchor="middle">arXiv</text>
    <text x="280" y="282" font-family="Arial, sans-serif" font-size="14" fill="#082f49" text-anchor="middle">Semantic Scholar</text>
    <text x="280" y="302" font-family="Arial, sans-serif" font-size="14" fill="#082f49" text-anchor="middle">HF Papers</text>
  </g>
  <line x1="375" y1="255" x2="417" y2="255" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Stage 2: Dedupe and Rank -->
  <g>
    <rect x="420" y="195" width="190" height="120" rx="14" fill="url(#source)"/>
    <text x="515" y="245" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#082f49" text-anchor="middle">Dedupe</text>
    <text x="515" y="270" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#082f49" text-anchor="middle">and Rank</text>
    <text x="515" y="295" font-family="Arial, sans-serif" font-size="14" fill="#082f49" text-anchor="middle">top N papers</text>
  </g>
  <line x1="610" y1="255" x2="652" y2="255" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Stage 3: Ingest -->
  <g>
    <rect x="655" y="195" width="190" height="120" rx="14" fill="url(#process)"/>
    <text x="750" y="240" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#1e1b4b" text-anchor="middle">Ingest PDFs</text>
    <text x="750" y="265" font-family="Arial, sans-serif" font-size="14" fill="#1e1b4b" text-anchor="middle">extract Limitations</text>
    <text x="750" y="285" font-family="Arial, sans-serif" font-size="14" fill="#1e1b4b" text-anchor="middle">and Future Work</text>
  </g>
  <line x1="845" y1="255" x2="887" y2="255" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Stage 4: Summarize -->
  <g>
    <rect x="890" y="195" width="190" height="120" rx="14" fill="url(#llm)"/>
    <text x="985" y="240" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#431407" text-anchor="middle">Summarize</text>
    <text x="985" y="265" font-family="Arial, sans-serif" font-size="14" fill="#431407" text-anchor="middle">small local model</text>
    <text x="985" y="285" font-family="Arial, sans-serif" font-size="14" fill="#431407" text-anchor="middle">per paper</text>
  </g>
  <line x1="1080" y1="255" x2="1122" y2="255" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Stage 5: Synthesize -->
  <g>
    <rect x="1125" y="195" width="190" height="120" rx="14" fill="url(#llm)"/>
    <text x="1220" y="240" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#431407" text-anchor="middle">Synthesize</text>
    <text x="1220" y="265" font-family="Arial, sans-serif" font-size="14" fill="#431407" text-anchor="middle">large local model</text>
    <text x="1220" y="285" font-family="Arial, sans-serif" font-size="14" fill="#431407" text-anchor="middle">grounded ideas</text>
  </g>
  <line x1="1315" y1="255" x2="1357" y2="255" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Stage 6: Report -->
  <g>
    <rect x="1360" y="195" width="200" height="120" rx="14" fill="url(#output)"/>
    <text x="1460" y="240" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#052e16" text-anchor="middle">Markdown Report</text>
    <text x="1460" y="265" font-family="Arial, sans-serif" font-size="13" fill="#052e16" text-anchor="middle">summaries, synthesis,</text>
    <text x="1460" y="285" font-family="Arial, sans-serif" font-size="13" fill="#052e16" text-anchor="middle">future work ideas</text>
  </g>

  <!-- caption -->
  <text x="800" y="380" font-family="Arial, sans-serif" font-size="17" fill="#334155" text-anchor="middle">
    one query, no intermediate prompts, one grounded report
  </text>
  <text x="800" y="408" font-family="Arial, sans-serif" font-size="15" fill="#64748b" text-anchor="middle">
    runs entirely on local hardware via Ollama
  </text>
</svg>
