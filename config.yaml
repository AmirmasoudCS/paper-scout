# ── Search Query Defaults ─────────────────────────────
search:
  max_papers_per_source: 10      # how many results to pull from each source before ranking
  final_paper_count: 10          # how many papers survive ranking to go into the full pipeline
  date_range_days: 365           # only consider papers published within this window ("newest")
  min_citation_count: 0          # filter floor; 0 = don't filter (new papers have few citations anyway)

# ── Sources ────────────────────────────────────────────
sources:
  arxiv:
    enabled: true
    categories: []               # optional arXiv category filters, e.g. ["cs.CL", "cs.LG"] — empty = no filter
  semantic_scholar:
    enabled: true
    api_key: null                # optional, raises rate limits; loaded from .env if set
  huggingface_papers:
    enabled: true

# ── Ranking ────────────────────────────────────────────
ranking:
  embedding_model: "BAAI/bge-small-en-v1.5"
  embedding_device: "cpu"        # force CPU — keep VRAM free for Ollama
  weights:                       # composite score weights, should sum to 1.0
    relevance: 0.5
    recency: 0.3
    citations: 0.2
  dedupe_similarity_threshold: 0.9   # title similarity above this = treated as duplicate

# ── Ingestion ──────────────────────────────────────────
ingestion:
  pdf_cache_dir: "outputs/pdf_cache"
  download_timeout_seconds: 30
  target_sections:               # section headers we try to extract from each paper
    - "abstract"
    - "conclusion"
    - "limitations"
    - "future work"
  fallback_to_abstract_only: true

# ── LLM ────────────────────────────────────────────────
llm:
  provider: "ollama"
  small_model:
    name: "qwen3.5:9b"
    temperature: 0.3
    max_tokens: 512
  large_model:
    name: "gemma4:e4b"
    temperature: 0.5
    max_tokens: 1500
  timeout_seconds: 120

# ── Report ─────────────────────────────────────────────
report:
  output_dir: "outputs"
  filename_template: "{query_slug}_{date}.md"
  include_toc: true

# ── Logging ────────────────────────────────────────────
logging:
  level: "INFO"
  log_dir: "log"