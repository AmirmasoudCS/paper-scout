<div class="progress-view active">

  <main class="main">
    <div class="report-header">
      <div class="eyebrow">Running</div>
      <h1 class="report-title">{{ query }}</h1>
    </div>

    <div class="progress-stages">
      {% for stage in stages %}
        <div class="progress-stage {{ stage.status }}">
          <span class="stage-dot"></span>
          <span>{{ stage.label }}</span>
        </div>
      {% endfor %}
    </div>
  </main>

</div>
