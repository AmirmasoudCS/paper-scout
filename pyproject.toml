[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-scout"
version = "0.1.0"
description = "Agentic pipeline for discovering and summarizing research papers"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["paper_scout*"]